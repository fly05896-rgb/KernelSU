name: Build Manager

on:
  push:
    branches: [ "main", "master", "dev", "ci" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:
  workflow_call:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_alias: ${{ steps.gen.outputs.key_alias }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Prepare or generate signing keystore
        id: gen
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$PROD_KEYSTORE" ] && [ -n "$PROD_KEYSTORE_PASSWORD" ] && [ -n "$PROD_KEY_ALIAS" ] && [ -n "$PROD_KEY_PASSWORD" ]; then
            echo "Using repository secret KEYSTORE..."
            echo "$PROD_KEYSTORE" | base64 -d > signing-key.jks
            echo "keystore=$PROD_KEYSTORE" >> $GITHUB_OUTPUT
            echo "keystore_password=$PROD_KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
            echo "key_alias=$PROD_KEY_ALIAS" >> $GITHUB_OUTPUT
            echo "key_password=$PROD_KEY_PASSWORD" >> $GITHUB_OUTPUT
          else
            echo "Generating self-contained RSA-2048 signing keystore..."
            KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            KEY_PASSWORD=$(openssl rand -hex 24)
            KEY_ALIAS="ksu-key"
            echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
            echo "key_alias=$KEY_ALIAS" >> $GITHUB_OUTPUT
            echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Android, OU=Android, O=Google Inc., L=Mountain View, ST=California, C=US" \
              -storetype JKS \
              -keystore signing-key.jks

            echo "keystore=$(base64 -w 0 signing-key.jks)" >> $GITHUB_OUTPUT
          fi

      - name: Extract certificate hash and size
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.gen.outputs.key_alias }}
        run: |
          keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore signing-key.jks \
            -storepass "$STORE_PASS" \
            -file cert.der

          SIZE_DEC=$(stat -c%s cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          HASH=$(sha256sum cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
          - target: riscv64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true

  build-ksud-extra:
    needs: [build-lkm, build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [generate-key]
    if: always() && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spoofed: [ false, true ]
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Spoof Package ID and Stealth Identifiers
        if: matrix.spoofed == true
        run: |
          chmod +x spoof
          ./spoof

      - name: Write signing key
        env:
          SIGN_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          SIGN_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          SIGN_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          SIGN_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$SIGN_KEYSTORE" | base64 -d > signing-key.jks
          {
            echo KEYSTORE_PASSWORD="$SIGN_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$SIGN_KEY_ALIAS"
            echo KEY_PASSWORD="$SIGN_KEY_PASSWORD"
            echo KEYSTORE_FILE="signing-key.jks"
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ matrix.spoofed }}" = "false" ]; then
            ./gradlew clean assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease
          fi

      - name: Upload gradle APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.spoofed && 'manager-gradle-spoofed' || 'manager-gradle' }}
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.spoofed && 'mappings-spoofed' || 'mappings' }}
          path: "manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spoofed: [ false, true ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.spoofed && 'manager-gradle-spoofed' || 'manager-gradle' }}
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          cp -f "$RISCV64_KSUD" target/riscv64-linux-android/release/ksud

      - name: Prepare signing inputs
        env:
          SIGN_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          SIGN_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          SIGN_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          SIGN_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$SIGN_KEYSTORE" | base64 -d > signing-key.jks
          echo "SIGN_KEYSTORE_FILE=signing-key.jks" >> $GITHUB_ENV
          echo "SIGN_KEY_ALIAS=$SIGN_KEY_ALIAS" >> $GITHUB_ENV
          echo "SIGN_KEYSTORE_PASSWORD=$SIGN_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGN_KEY_PASSWORD=$SIGN_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Repack and resign
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -a riscv64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Upload final Manager APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.spoofed && 'manager-spoofed' || 'manager' }}
          path: dist/*.apk

      - name: Upload to telegram
        if: github.event_name != 'pull_request' && steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          GITHUB_EVENT: ${{ toJson(github.event) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ matrix.spoofed && 'Manager (Spoofed)' || 'Manager (Normal)' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            export VERSION=$(git rev-list --count HEAD)
            APK=$(find ./dist -name "*.apk")
            pip3 install telethon
            python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK
          fi
